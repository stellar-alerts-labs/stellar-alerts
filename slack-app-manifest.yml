# Slack App manifest for the Stellar Alerts slash commands (issue #452).
#
# To install: Slack app settings -> "App Manifest" -> paste this file, then
# replace <your-api-host> with the publicly reachable host of this API and
# set SLACK_SIGNING_SECRET (shown under "App Credentials") in the API env.
display_information:
  name: Stellar Alerts
  description: Track Stellar wallets and receive payment alerts
  background_color: "#0B0F19"
features:
  bot_user:
    display_name: Stellar Alerts
    always_online: true
  slash_commands:
    - command: /stellar
      url: https://<your-api-host>/slack/commands
      description: Query wallet status — balances and alert rules
      usage_hint: "[balance|alerts] [wallet address]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
