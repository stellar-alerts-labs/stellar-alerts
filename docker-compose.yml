services:
  postgres:
    image: postgres:16-alpine
    container_name: stellar_alerts_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: stellar_alerts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d stellar_alerts" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stellar_alerts_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Chaos-engineering fault injection proxy (#145). The API test suite spins
  # up its own local fixture server on an ephemeral port and talks to it
  # *through* toxiproxy so tests can inject deterministic latency/timeouts/
  # disconnects — see apps/api/src/__tests__/chaos.test.ts. Not used at
  # runtime by the app itself, only by the chaos test suite (gated on
  # TOXIPROXY_URL).
  #
  # Uses host networking so toxiproxy can reach whatever ephemeral port the
  # test process's fixture server bound to on localhost, without needing to
  # pre-declare/pass that port into the container. This is Linux-only
  # (matches the ubuntu-latest CI runner this is primarily meant for); on
  # macOS/Windows Docker Desktop, run toxiproxy directly on the host instead
  # (`docker run --network host ghcr.io/shopify/toxiproxy:latest` won't work
  # there either — use `-p 8474:8474 -p 8666:8666` and point
  # TOXIPROXY_UPSTREAM_HOST at host.docker.internal).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    container_name: stellar_alerts_toxiproxy
    restart: unless-stopped
    ports:
      - "8474:8474"
      - "8666:8666"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Distributed tracing backend for the webhook dispatcher's OTLP exporter.
  # The app ships spans over OTLP/HTTP to :4318 (see OTEL_EXPORTER_OTLP_ENDPOINT),
  # so no Jaeger-specific SDK is involved — point the endpoint at this collector
  # and the same spans also work with any other OTLP backend.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: stellar_alerts_jaeger
    restart: unless-stopped
    environment:
      # Enables the OTLP receiver on 4317 (gRPC) and 4318 (HTTP). Required from
      # Jaeger v1.35 onward; without it the app has nowhere to send spans.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP/HTTP receiver
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:16686/ >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Metrics backend. Scrapes the API's /metrics route and, when
  # WORKER_METRICS_ENABLED=true, the dispatcher's own scrape endpoint — the
  # worker process is where most webhook deliveries actually happen, so
  # scraping only the API would miss them.
  prometheus:
    image: prom/prometheus:latest
    container_name: stellar_alerts_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # The app is normally run on the host in development, not as a compose
      # service, so Prometheus reaches it through the host gateway.
      - "host.docker.internal:host-gateway"
    depends_on:
      - jaeger

volumes:
  postgres_data:
