name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: stellar_alerts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Verify generated OpenAPI types are up to date
        run: npm run generate:types:check

      - name: Build Shared Package (@stellar-alerts/shared)
        run: npx tsc -p packages/shared/tsconfig.json

      - name: Typecheck Backend (apps/api)
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Typecheck Frontend (apps/web)
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Push Prisma Schema (test database)
        run: npm run db:push
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/stellar_alerts?schema=public"

      - name: Run API Unit Tests
        run: npm run test:api
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/stellar_alerts?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-unit-test-secret-key-min-32-chars!!"
          MASTER_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NODE_ENV: "test"

      - name: Run Web Lint
        run: npm run lint --workspace=web

      - name: Run Web Unit Tests
        run: npm run test --workspace=web

      - name: Build Web Application
        run: npm run build --workspace=web
        env:
          NEXTAUTH_SECRET: "ci-build-dummy-secret-key-123456"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"

  integration:
    name: Integration Fixtures (Postgres + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: stellar_alerts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stellar_alerts_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Build Shared Package (@stellar-alerts/shared)
        run: npx tsc -p packages/shared/tsconfig.json

      - name: Run Integration Fixture Tests
        working-directory: apps/api
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/stellar_alerts_test"
          TEST_REDIS_URL: "redis://localhost:6379"
          NODE_ENV: "test"

  chaos:
    name: Chaos Engineering Fault Injection Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Build Shared Package (@stellar-alerts/shared)
        run: npx tsc -p packages/shared/tsconfig.json

      # docker-compose.yml runs toxiproxy with network_mode: host, which is
      # Linux-only — exactly what ubuntu-latest runners are, so this needs
      # no extra host-gateway wiring (the chaos suite's own fixture server
      # binds to 127.0.0.1, directly reachable from the toxoproxy container).
      - name: Start Toxoproxy
        run: docker compose up -d toxoproxy

      - name: Wait for Toxoproxy to be ready
        run: |
          for i in $(seq 1 1 30); do
            if curl -sf http://localhost:8474/version > /dev/null; then
              echo "Toxoproxy is up"
              exit 0
            fi
            sleep 1
          done
          echo "Toxoproxy did not become ready in time" >&2
          docker compose logs toxoproxy
          exit 1

      - name: Run Chaos Test Suite
        working-directory: apps/api
        run: npx vitest run src/__tests__/chaos.test.ts
        env:
          TOXOPROXY_URL: http://localhost:8474

      - name: Stop Toxoproxy
        if: always()
        run: docker compose down toxoproxy || true
