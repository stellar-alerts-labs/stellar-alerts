name: Terraform Validate

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform fmt & validate (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ aws, gcp, do ]

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (backendless, providers only)
        run: terraform init -backend=false

      - name: Terraform validate (${{ matrix.target }})
        run: terraform validate
        env:
          # Provider blocks are present for all three clouds; validate only
          # needs provider schemas, but AWS/GOOGLE/DO tokens keep provider
          # configuration happy where credentials are required at plan-time.
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_REGION: us-east-1
          GOOGLE_CREDENTIALS: '{}'
          DIGITALOCEAN_TOKEN: dummy
