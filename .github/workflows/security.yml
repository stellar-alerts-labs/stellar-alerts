name: Dependency Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  stellar-secret-scan:
    name: Stellar Secret Key Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/stellar-secret-scanner.mjs --history

  osv-scan:
    name: OSV Dependency Vulnerability Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --recursive
        ./
      results-file-name: security-audit-report.sarif
      fail-on-vuln: true
    secrets: inherit
